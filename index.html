<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NameAGuy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">N</div>
          <div>
            <p class="eyebrow">Quiz challenge</p>
            <h1>NameAGuy</h1>
          </div>
        </div>
        <button id="new-game-btn" class="secondary-btn" type="button">New game</button>
      </header>

      <main class="game-panel">
        <section class="score-row">
          <div class="score-box">
            <span class="label">Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="score-box">
            <span class="label">Streak</span>
            <strong id="streak">0</strong>
          </div>
          <div class="score-box">
            <span class="label">Lives</span>
            <strong id="lives-left">3</strong>
          </div>
        </section>

        <section class="prompt-card">
          <div class="prompt-header">
            <p class="prompt-label">Prompt</p>
            <span id="difficulty-badge" class="difficulty-badge">Warm-up</span>
          </div>
          <h2 id="prompt-text">Loading prompt...</h2>
        </section>

        <form id="answer-form" class="answer-form">
          <label class="sr-only" for="answer-input">Your answer</label>
          <div class="answer-input-wrap">
            <input
              id="answer-input"
              name="answer"
              type="text"
              placeholder="Type the guy's name..."
              autocomplete="off"
              spellcheck="false"
            />
            <div id="suggestions" class="suggestions" aria-live="polite"></div>
          </div>
          <div class="button-row">
            <button id="submit-btn" class="primary-btn" type="submit">Submit</button>
            <button id="skip-btn" class="secondary-btn" type="button">Skip</button>
          </div>
        </form>

        <p id="feedback" class="feedback" aria-live="polite">Make your guess.</p>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
