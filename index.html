<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NameAGuy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=3" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <h1>Name a Guy</h1>
          <div id="difficulty-options" class="difficulty-options" aria-label="Difficulty">
            <button class="difficulty-option active" data-difficulty="easy" type="button">Easy</button>
            <button class="difficulty-option" data-difficulty="medium" type="button">Medium</button>
            <button class="difficulty-option" data-difficulty="hard" type="button">Hard</button>
          </div>
        </div>
        <div class="header-actions">
          <button id="new-game-btn" class="secondary-btn" type="button">New game</button>
        </div>
      </header>

      <div class="game-layout">
        <main class="game-panel">
          <section class="prompt-card">
          <div class="prompt-header">
            <p id="prompt-label" class="prompt-label">Prompt</p>
            <span id="difficulty-badge" class="difficulty-badge">Guess 1 of 6</span>
          </div>
          <h2 id="prompt-text">Name a Guy</h2>
          </section>

          <section class="clues-panel" aria-live="polite">
            <p class="result-label">Clues</p>
            <ul id="hint-list" class="hint-list"></ul>
            <div class="vague-hint-block">
              <p class="result-label">Hint 1</p>
              <p id="hint-1" class="fun-fact"></p>
            </div>
            <div class="fact-block">
              <p class="result-label">Hint 2</p>
              <p id="hint-2" class="fun-fact"></p>
            </div>
            <div class="shared-tags-block">
              <p class="result-label">Clues in Common with Incorrect Guesses</p>
              <div id="shared-tags" class="tag-list"></div>
            </div>
          </section>

        <form id="answer-form" class="answer-form">
          <label class="sr-only" for="answer-input">Your answer</label>
          <div class="answer-input-wrap">
            <input
              id="answer-input"
              name="answer"
              type="text"
              placeholder="Type the guy's name..."
              autocomplete="off"
              spellcheck="false"
            />
            <div id="suggestions" class="suggestions" aria-live="polite"></div>
          </div>
          <div class="button-row">
            <button id="submit-btn" class="primary-btn" type="submit">Submit</button>
            <button id="skip-btn" class="secondary-btn" type="button">Reveal answer</button>
          </div>
          <section class="previous-guesses-panel" aria-live="polite">
            <p class="result-label">Previous guesses</p>
            <ol id="previous-guesses" class="previous-guesses"></ol>
          </section>
        </form>

        <p id="feedback" class="feedback" aria-live="polite">Make your guess.</p>

        <section id="result" class="result" aria-live="polite">
        </section>
        </main>

        <aside class="guess-sidebar">
          <div class="guess-count">
            <span class="label">Guesses left</span>
            <strong id="lives-left">6</strong>
          </div>
        </aside>
      </div>
    </div>

    <script src="script.js?v=3"></script>
  </body>
</html>
