<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Name a Guy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=6" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <h1>Name a
            <label class="sr-only" for="mode-options">Game mode</label>
            <select id="mode-options" class="mode-select" aria-label="Game mode">
              <option value="guy">Guy</option>
              <option value="gal">Gal</option>
            </select>
          </h1>
        </div>
      </header>

      <div class="header-actions">
        <label class="sr-only" for="difficulty-options">Difficulty</label>
        <select id="difficulty-options" class="difficulty-options" aria-label="Difficulty">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
        <button id="new-game-btn" class="secondary-btn" type="button">New game</button>
      </div>

      <div class="game-layout">
        <main class="game-panel">
          <section class="prompt-card">
          <div class="prompt-header">
            <p id="prompt-label" class="prompt-label"></p>
            <div class="guess-progress" aria-label="Guesses">
              <span class="guess-progress-label">Guesses</span>
              <div id="guess-dots" class="guess-dots" aria-label="6 guesses remaining"></div>
            </div>
          </div>
          <h2 id="prompt-text"></h2>
          </section>

          <section class="clues-panel" aria-live="polite">
            <p class="result-label">Clues</p>
            <ul id="hint-list" class="hint-list"></ul>
            <div class="vague-hint-block">
              <p class="result-label">Hint 1</p>
              <p id="hint-1" class="fun-fact"></p>
            </div>
            <div class="fact-block">
              <p class="result-label">Hint 2</p>
              <p id="hint-2" class="fun-fact"></p>
            </div>
            <div class="shared-tags-block">
              <p class="result-label">Clues Shared with Incorrect Guesses</p>
              <div id="shared-tags" class="tag-list"></div>
            </div>
          </section>

        <form id="answer-form" class="answer-form">
          <label class="sr-only" for="answer-input">Your answer</label>
          <div class="answer-input-wrap">
            <input
              id="answer-input"
              name="answer"
              type="text"
              placeholder="Type the guy's name..."
              autocomplete="off"
              spellcheck="false"
            />
            <div id="suggestions" class="suggestions" aria-live="polite"></div>
          </div>
          <div class="button-row">
            <button id="submit-btn" class="primary-btn" type="submit">Submit</button>
            <button id="skip-btn" class="secondary-btn" type="button">Reveal answer</button>
          </div>
          <section class="previous-guesses-panel" aria-live="polite">
            <p class="result-label">Previous guesses</p>
            <ol id="previous-guesses" class="previous-guesses"></ol>
          </section>
        </form>

        <section id="result" class="result" aria-live="polite">
        </section>
        </main>

      </div>
    </div>

    <script src="script.js?v=6"></script>
  </body>
</html>
